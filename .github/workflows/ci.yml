name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,web]"
      - run: ruff check contextbridge tests
      - run: ruff format --check contextbridge tests
      - run: pytest -q
      - name: Offline evaluation (no API calls)
        run: python -m contextbridge.cli eval
