# OpenTelemetry Collector configuration used by ``docker compose --profile observability``.
# Receives OTLP from the app and forwards traces to Jaeger; swap the exporter for
# your vendor (Honeycomb, Grafana Tempo, AWS X-Ray via the ADOT collector, ...).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s
  memory_limiter:
    check_interval: 5s
    limit_mib: 256

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
