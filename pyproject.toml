[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge"
version = "0.4.0"
description = "Portable, privacy-conscious working memory for moving work between ChatGPT, Claude, and local models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Tirth Patel"},
]
keywords = ["llm", "context", "memory", "ai", "cross-model", "privacy", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.7.4",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
web = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "PyPDF2>=3.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "PyPDF2>=3.0.0",
]
postgres = [
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
]
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
all = [
    "contextbridge[web,api,postgres,otel]",
]
dev = [
    "contextbridge[web,api,postgres,otel]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/TirthPatel6104/ContextBridge"
Repository = "https://github.com/TirthPatel6104/ContextBridge"
Changelog = "https://github.com/TirthPatel6104/ContextBridge/blob/main/CHANGELOG.md"

[project.scripts]
cb = "contextbridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextbridge*"]

[tool.setuptools.package-data]
contextbridge = [
    "web/templates/*.html",
    "web/static/*",
    "evaluation/fixtures/*.json",
    "storage/sql/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["contextbridge"]
branch = false
omit = [
    "contextbridge/adapters/*",
    "contextbridge/web/app.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "except ImportError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
